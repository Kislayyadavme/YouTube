services:
  - type: web
    name: yt-downloader-pro
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      apt-get update && apt-get install -y ffmpeg || true
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 600 --keep-alive 5
    envVars:
      - key: DOWNLOAD_DIR
        value: /tmp/ytdl_downloads
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
